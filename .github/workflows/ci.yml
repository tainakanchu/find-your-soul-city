name: CI / Pages

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  etl:
    # Offline checks only: the full ETL downloads tens of GB and is run locally with `pnpm etl`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
        working-directory: etl
      - run: uv run ruff check soulcity_etl tests
        working-directory: etl
      - run: uv run pytest -q
        working-directory: etl

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm knowledge:check
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm validate
        env:
          VALIDATE_N: 300
      - run: pnpm build
        env:
          # Project site: https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [etl, check]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
